name: Compilar PDF Editor (iOS 9 / armv7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA armv7
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip \
            git libxml2 libplist-dev libssl-dev pkg-config xz-utils

      - name: Instalar Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Instalar SDK do iOS 9.3
        run: |
          export THEOS="$HOME/theos"
          mkdir -p "$THEOS/sdks"
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks /tmp/theos-sdks
          cd /tmp/theos-sdks
          git sparse-checkout set iPhoneOS9.3.sdk
          cp -R iPhoneOS9.3.sdk "$THEOS/sdks/"
          # O SDK 9.3 de theos/sdks nao traz liblaunch.tbd, embora libSystem.B.tbd
          # o re-exporte. Sem esse stub o ld falha com:
          #   ld: file not found: /usr/lib/system/liblaunch.dylib for architecture armv7
          curl -fsSL https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS10.3.sdk/usr/lib/system/liblaunch.tbd \
            -o "$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd"
          # O SDK 9.3 tambem nao traz libsystem_c.tbd (onde memcpy vive), entao copiamos do 10.3.
          curl -fsSL https://raw.githubusercontent.com/theos/sdks/master/iPhoneOS10.3.sdk/usr/lib/system/libsystem_c.tbd \
            -o "$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/libsystem_c.tbd"
          test -s "$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/liblaunch.tbd"
          test -s "$THEOS/sdks/iPhoneOS9.3.sdk/usr/lib/system/libsystem_c.tbd"
          ls -d "$THEOS/sdks/iPhoneOS9.3.sdk"

      - name: Instalar ldid (assinatura ad-hoc)
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid /tmp/ldid
          make -C /tmp/ldid
          sudo cp /tmp/ldid/ldid /usr/local/bin/ldid

      - name: Compilar e empacotar IPA
        run: |
          export THEOS="$HOME/theos"
          chmod +x theos/build.sh
          ./theos/build.sh

      - name: Verificar IPA
        run: python3 verify-ipa.py theos/PDFEditor.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-iOS9-armv7
          path: theos/PDFEditor.ipa
          if-no-files-found: error
