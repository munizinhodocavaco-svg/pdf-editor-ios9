name: Compilar PDF Editor (iOS 9 / armv7)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build IPA armv7
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip unzip \
            git libxml2 libplist-dev libssl-dev pkg-config xz-utils

      - name: Instalar Theos
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"

      - name: Instalar SDK do iOS 9.3
        run: |
          export THEOS="$HOME/theos"
          "$THEOS/bin/install-sdk" 9.3
          ls -d "$THEOS"/sdks/iPhoneOS9.3.sdk

      - name: Instalar ldid (assinatura ad-hoc)
        run: |
          git clone --depth=1 https://github.com/ProcursusTeam/ldid /tmp/ldid
          make -C /tmp/ldid
          sudo cp /tmp/ldid/ldid /usr/local/bin/ldid

      - name: Compilar e empacotar IPA
        run: |
          export THEOS="$HOME/theos"
          chmod +x theos/build.sh
          ./theos/build.sh

      - name: Verificar IPA
        run: python3 verify-ipa.py theos/PDFEditor.ipa

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: PDFEditor-iOS9-armv7
          path: theos/PDFEditor.ipa
          if-no-files-found: error
